name: Trigger build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger:
    if: contains(fromJSON('["dev", "alpha", "beta", "main"]'), github.ref_name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Missing required repository/organization secret RELEASE_TOKEN"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Push one empty Conventional Commit
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: trigger release build'
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
