name: Python SDK
on:
  pull_request:
  push:
    branches: [alpha]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate.py --check
      - run: ruff check src scripts tests examples
      - run: mypy src
      - run: pytest --cov=envai --cov-report=term-missing
      - run: python -m build
      - name: Verify wheel schema resources and import outside source tree
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c "import envai; from envai._schema import OPERATIONS; assert len(OPERATIONS) == 52; print(envai.__version__)"
