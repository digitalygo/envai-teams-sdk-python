name: Python SDK
on:
  pull_request:
  push:
    branches: [dev, alpha, beta, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: envai_wiki_test
          POSTGRES_USER: envai
          POSTGRES_PASSWORD: envai_sdk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U envai -d envai_wiki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://envai:envai_sdk_test@127.0.0.1:5432/envai_wiki_test?sslmode=disable
      ENVAI_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/generate.py --check
      - run: ruff check src scripts tests examples
      - run: mypy src
      - run: pytest --cov=envai --cov-report=term-missing
      - run: python -m build
      - name: Verify wheel schema resources and import outside source tree
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c "import envai; from envai._schema import OPERATIONS; assert len(OPERATIONS) == 71; print(envai.__version__)"

  release-checks:
    name: Release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/release-tools/test -p '*_test.py'
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - run: node .github/release-tools/patch-semantic-release.mjs
      - run: npm test --prefix .github/release-tools
      - run: npm audit --audit-level=high --prefix .github/release-tools

  release:
    needs: [test, release-checks]
    if: github.event_name == 'push' && contains(fromJSON('["dev", "alpha", "beta", "main"]'), github.ref_name)
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      KCHAT_WEBHOOK_URL: ${{ secrets.KCHAT_WEBHOOK_URL }}
