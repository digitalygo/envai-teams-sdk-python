[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "envai-teams-sdk"
version = "1.0.0a4"
description = "Typed synchronous and asynchronous Envai Teams client with negotiated ATP3 streaming and Wiki V1"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DigItalyGo"}]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "jsonschema>=4.23,<5", "cryptography>=43", "rfc8785>=0.1.4,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["psycopg[binary]>=3.2,<4", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.11", "PyYAML>=6", "build>=1.2", "types-jsonschema", "types-PyYAML"]

[tool.hatch.build.targets.sdist]
only-include = ["src/envai", "tests", "scripts", "docs", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/envai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["envai"]
omit = ["*/_generated.py", "*/models.py", "*/event_models.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/envai/models.py" = ["I"]
"src/envai/_generated.py" = ["I", "F401"]
"src/envai/event_models.py" = ["I"]
